name: Update profile stats

on:
  schedule:
    # every hour, offset from :00 to reduce Actions congestion
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - "scripts/generate_projects.py"
      - "scripts/generate_skills.py"
      - "scripts/generate_connect.py"
      - "scripts/generate_about.py"
      - ".github/workflows/stats.yml"

concurrency:
  group: profile-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats / languages / contributions SVGs
        env:
          GITHUB_USERNAME: canekin
          # Prefer a classic/fine-grained PAT with `repo` + read:user
          # (private repo counts + private contribution calendar).
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Generate recently-pushed projects SVG
        env:
          GITHUB_USERNAME: canekin
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_projects.py

      - name: Generate skills SVG
        run: python scripts/generate_skills.py

      - name: Generate connect SVG
        run: python scripts/generate_connect.py

      - name: Generate about SVG
        run: python scripts/generate_about.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/stats.svg generated/languages.svg generated/contributions.svg generated/projects.svg generated/skills.svg generated/connect.svg generated/about.svg
          if git diff --staged --quiet; then
            echo "No profile asset changes"
            exit 0
          fi
          git commit -m "chore: refresh live profile assets"
          git pull --rebase origin main
          git push
