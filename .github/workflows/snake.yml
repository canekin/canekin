# Kept as a thin manual trigger. Scheduled refresh lives in stats.yml (hourly, includes snake).
name: Generate contribution snake

on:
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake SVG (github-dark)
        uses: Platane/snk@v3
        with:
          github_user_name: canekin
          github_token: ${{ secrets.PROFILE_TOKEN || github.token }}
          outputs: |
            generated/github-snake-dark.svg?palette=github-dark

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frame snake SVG like contributions card
        env:
          GITHUB_USERNAME: canekin
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/frame_snake.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution snake"
          file_pattern: "generated/github-snake-dark.svg"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"