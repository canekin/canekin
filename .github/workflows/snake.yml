name: Generate contribution snake

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/frame_snake.py"

concurrency:
  group: profile-snake
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVG (github-dark)
        uses: Platane/snk@v3
        with:
          github_user_name: canekin
          # PROFILE_TOKEN sees the same public+private calendar as the profile graph.
          # Default GITHUB_TOKEN only returns public contribution days → sparse snake.
          github_token: ${{ secrets.PROFILE_TOKEN || github.token }}
          outputs: |
            generated/github-snake-dark.svg?palette=github-dark

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frame snake SVG like contributions card
        env:
          GITHUB_USERNAME: canekin
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/frame_snake.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/github-snake-dark.svg
          if git diff --staged --quiet; then
            echo "No snake changes"
            exit 0
          fi
          git commit -m "chore: refresh contribution snake"
          git pull --rebase origin main
          git push
